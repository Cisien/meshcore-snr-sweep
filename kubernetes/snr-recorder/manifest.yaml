# Survey data recorder: subscribes to meshcore/snr/# and persists everything to
# a SQLite DB on a PVC, serving a small HTTP API for retrieval.
#
# The container image is built from this repo (see scripts/Dockerfile) and pushed
# to the cluster's zot registry (registry.cisien.com). Build/push steps are in
# docs/DEPLOY.md.
#
# Apply:  kubectl apply -f kubernetes/snr-recorder/
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: snr-recorder-data
  namespace: mqtt
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nas-nfs
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: snr-recorder-env
  namespace: mqtt
type: Opaque
stringData:
  # LAN-only broker (in-cluster service name; plain TCP). Override if the
  # recorder runs off-cluster.
  MQTT_HOST: "mosquitto.mqtt.svc.cluster.local"
  MQTT_PORT: "1883"
  SNR_BIND: "0.0.0.0:8080"
  SNR_DB: "/data/snr.sqlite3"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snr-recorder
  namespace: mqtt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: snr-recorder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snr-recorder
    spec:
      containers:
        - name: snr-recorder
          image: registry.cisien.com/meshcore/snr-recorder:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: snr-recorder-env
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: snr-recorder-data
---
apiVersion: v1
kind: Service
metadata:
  name: snr-recorder
  namespace: mqtt
spec:
  selector:
    app.kubernetes.io/name: snr-recorder
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Expose the recorder API on the LAN so results can be pulled without kubectl.
apiVersion: v1
kind: Service
metadata:
  name: snr-recorder-lan
  namespace: mqtt
  labels:
    app.kubernetes.io/name: snr-recorder
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: snr-recorder
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30884
