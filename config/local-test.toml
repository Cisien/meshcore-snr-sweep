# Local two-radio validation config.
# Used for the overnight full-spectrum link test on this bench (G2 + G3).
# Also complete enough to drive a local noise sweep.
node_id = "g2"
mqtt_host = "127.0.0.1"
mqtt_port = 1883
sf = 7
cr = 5
bandwidth_khz = 500
tx_power_dbm = 7
band_start_mhz = 902.3
band_end_mhz = 915.0
step_khz = 100
# baseline reference reading (MeshCore default deployment settings)
baseline_enabled = true
baseline_freq_mhz = 910.525
baseline_bandwidth_hz = 62500
baseline_sf = 7
baseline_cr = 5
# noise sampling (≤10 s/channel: 5 s settle + 5 s sampling window)
sample_count = 10
channel_duration_s = 5
settle_s = 5
# link test (aggressive: chips retune in ~tens of ms)
link_settle_s = 0.3
link_rx_lead_s = 0.7
link_rx_window_s = 3.0
link_tx_wait_s = 0.5
log_dir = "./data"
